{% extends "layouts/base.html" %}

{% block title %}Профиль{% endblock %}

{% block content %}
<section class="card border-0 shadow-sm">
    <div class="card-body">
        <h1 class="h4 mb-3">Профиль</h1>
        <p class="mb-1"><strong>Email:</strong> {{ request.user.email }}</p>
        <p class="small text-muted">Email только для чтения.</p>
        <form method="post" class="mt-3" novalidate>
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Сохранить никнейм</button>
        </form>
        <a class="d-inline-block mt-3" href="{% url 'accounts:password_reset' %}">Сменить пароль через email</a>
    </div>
</section>
{% endblock %}
