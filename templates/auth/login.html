{% extends "layouts/base.html" %}

{% block title %}Вход{% endblock %}

{% block content %}
<section class="card border-0 shadow-sm auth-card">
    <div class="card-body auth-card-body">
        <h1 class="h4 mb-3">Вход</h1>
        <form method="post" novalidate>
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100">Войти</button>
        </form>
        <div class="mt-3 d-flex flex-column gap-2">
            <a class="btn btn-warning w-100" href="{% url 'accounts:register' %}">Регистрация</a>
            <a class="btn btn-secondary w-100" href="{% url 'accounts:password_reset' %}">Забыли пароль?</a>
        </div>
    </div>
</section>
{% endblock %}
