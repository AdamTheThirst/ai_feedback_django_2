{% extends "layouts/base.html" %}

{% block title %}Восстановление пароля{% endblock %}

{% block content %}
<section class="card border-0 shadow-sm auth-card">
    <div class="card-body auth-card-body">
        <h1 class="h4 mb-3">Восстановление пароля</h1>
        <form method="post" novalidate>
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100">Отправить ссылку</button>
        </form>
    </div>
</section>
{% endblock %}
